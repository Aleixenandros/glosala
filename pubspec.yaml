name: glosala
description: "Un espacio local para tus notas Markdown y tus ideas conectadas."
publish_to: 'none'

version: 0.2.0+2

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  file_picker: ^13.3.3
  url_launcher: ^6.3.3
  idb_shim: ^2.11.3
  yaml: ^3.1.4
  flutter_localizations:
    sdk: flutter
  dio: ^5.11.1
  pdf: ^3.13.1
  archive: ^4.7.1
  xml: ^7.1.0
  crypto: ^3.0.8
  window_manager: ^0.5.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  open_filex: ^5.0.0
  mime: ^2.0.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - recursos/idiomas/
    - recursos/fuentes/Inter.ttf
    - recursos/fuentes/JetBrainsMono.ttf
  fonts:
    - family: Inter
      fonts:
        - asset: recursos/fuentes/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: recursos/fuentes/JetBrainsMono.ttf
