name: Integración continua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integracion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-y-compilar:
    uses: ./.github/workflows/compilar.yml
