name: Validar y compilar Glosala

on:
  workflow_call:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.0'
  WIX_VERSION: '5.0.2'
  DOTNET_ROLL_FORWARD: Major

jobs:
  verificar:
    name: Formato, análisis y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Instalar dependencias fijadas
        run: flutter pub get --enforce-lockfile
      - name: Comprobar formato
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analizar código
        run: flutter analyze --fatal-infos
      - name: Validar catálogos y versión
        run: python3 herramientas/verificar_proyecto.py
      - name: Probar herramientas de distribución
        run: python3 -m unittest discover -s herramientas -p '*_test.py' -v
      - name: Ejecutar pruebas
        run: flutter test --coverage
      - name: Guardar cobertura
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cobertura
          path: coverage/lcov.info
          if-no-files-found: error

  compilar:
    name: Compilar · ${{ matrix.plataforma }}
    needs: verificar
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - plataforma: linux
            sistema: ubuntu-24.04
            comando: flutter build linux --release
          - plataforma: windows
            sistema: windows-latest
            comando: flutter build windows --release
          - plataforma: macos
            sistema: macos-latest
            comando: flutter build macos --release
          - plataforma: android
            sistema: ubuntu-24.04
            comando: flutter build apk --release
          - plataforma: ios
            sistema: macos-latest
            comando: flutter build ios --release --no-codesign
          - plataforma: web
            sistema: ubuntu-24.04
            comando: flutter build web --release --no-web-resources-cdn
    runs-on: ${{ matrix.sistema }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Preparar Java para Android
        if: matrix.plataforma == 'android'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar bibliotecas Linux
        if: matrix.plataforma == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libmpv-dev dpkg-dev rpm desktop-file-utils xvfb xauth
      - name: Preparar instaladores de Windows
        if: matrix.plataforma == 'windows'
        shell: pwsh
        run: |
          $herramientas = Join-Path $env:RUNNER_TEMP 'glosala-wix'
          dotnet tool install wix --version $env:WIX_VERSION --tool-path $herramientas
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wix = Join-Path $herramientas 'wix.exe'
          foreach ($extension in @('UI', 'BootstrapperApplications')) {
            & $wix extension add -g "WixToolset.$extension.wixext/$env:WIX_VERSION"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $biblioteca = Join-Path $env:USERPROFILE ".wix/extensions/WixToolset.$extension.wixext/$env:WIX_VERSION/wixext5/WixToolset.$extension.wixext.dll"
            if (-not (Test-Path $biblioteca)) { throw "No se ha instalado la extensión $extension de WiX" }
          }
          $herramientas >> $env:GITHUB_PATH
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $runtime = Get-ChildItem "$visualStudio/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $runtime) { throw 'No se ha encontrado el runtime x64 de Visual C++' }
          "GLOSALA_VC_REDIST=$($runtime.FullName)" >> $env:GITHUB_ENV
          $archivoNsis = Join-Path $env:RUNNER_TEMP 'nsis-3.13.zip'
          Invoke-WebRequest 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip' -OutFile $archivoNsis
          if ((Get-FileHash $archivoNsis -Algorithm SHA256).Hash -ne 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8') {
            throw 'La descarga de NSIS no coincide con la versión verificada'
          }
          Expand-Archive $archivoNsis $env:RUNNER_TEMP
          (Join-Path $env:RUNNER_TEMP 'nsis-3.13') >> $env:GITHUB_PATH
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Instalar dependencias fijadas
        run: flutter pub get --enforce-lockfile
      - name: Compilar aplicación
        run: ${{ matrix.comando }}
      - name: Empaquetar aplicación completa
        run: python herramientas/empaquetar.py ${{ matrix.plataforma }}
      - name: Comprobar paquetes esperados
        run: python herramientas/verificar_paquetes.py ${{ matrix.plataforma }}
      - name: Probar MSI, EXE y ejecutable portable
        if: matrix.plataforma == 'windows'
        shell: pwsh
        run: ./herramientas/probar_instaladores_windows.ps1
      - name: Comprobar instalación de escritorio Unix
        if: matrix.plataforma == 'linux' || matrix.plataforma == 'macos'
        run: python3 herramientas/probar_instaladores_unix.py ${{ matrix.plataforma }}
      - name: Instalar y desinstalar RPM en Fedora
        if: matrix.plataforma == 'linux'
        run: |
          docker run --rm -v "$PWD/distribucion:/paquetes:ro" -v "$PWD/herramientas/probar_rpm.sh:/probar_rpm.sh:ro" fedora:44 bash /probar_rpm.sh
      - name: Guardar paquete
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: glosala-${{ matrix.plataforma }}
          path: distribucion/*
          if-no-files-found: error
          retention-days: 14
