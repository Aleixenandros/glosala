name: Validar y compilar Glosala

on:
  workflow_call:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  verificar:
    name: Formato, análisis y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Instalar dependencias fijadas
        run: flutter pub get --enforce-lockfile
      - name: Comprobar formato
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analizar código
        run: flutter analyze --fatal-infos
      - name: Validar catálogos y versión
        run: python3 herramientas/verificar_proyecto.py
      - name: Ejecutar pruebas
        run: flutter test --coverage
      - name: Guardar cobertura
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cobertura
          path: coverage/lcov.info
          if-no-files-found: error

  compilar:
    name: Compilar · ${{ matrix.plataforma }}
    needs: verificar
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - plataforma: linux
            sistema: ubuntu-24.04
            comando: flutter build linux --release
          - plataforma: windows
            sistema: windows-latest
            comando: flutter build windows --release
          - plataforma: macos
            sistema: macos-latest
            comando: flutter build macos --release
          - plataforma: android
            sistema: ubuntu-24.04
            comando: flutter build apk --release
          - plataforma: ios
            sistema: macos-latest
            comando: flutter build ios --release --no-codesign
          - plataforma: web
            sistema: ubuntu-24.04
            comando: flutter build web --release --no-web-resources-cdn
    runs-on: ${{ matrix.sistema }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Preparar Java para Android
        if: matrix.plataforma == 'android'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar bibliotecas Linux
        if: matrix.plataforma == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Instalar dependencias fijadas
        run: flutter pub get --enforce-lockfile
      - name: Compilar aplicación
        run: ${{ matrix.comando }}
      - name: Empaquetar aplicación completa
        run: python herramientas/empaquetar.py ${{ matrix.plataforma }}
      - name: Guardar paquete
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: glosala-${{ matrix.plataforma }}
          path: distribucion/*
          if-no-files-found: error
          retention-days: 14
